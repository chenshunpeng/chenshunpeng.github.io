summary: >-
  I am a Ph.D. student at Beijing University of Posts and Telecommunications (BUPT).
  I am fortunate to be co-advised by
  <a href="https://scholar.google.com/citations?user=htmrWvUAAAAJ&amp;hl=zh-CN" target="_blank" rel="noopener noreferrer">Prof. Shibiao Xu</a>
  and <a href="https://dblp.org/pid/02/929-4.html" target="_blank" rel="noopener noreferrer">Prof. Li Guo</a>.
  My research focuses on Visual Place Recognition, Visual Localization,
  Multimodal Learning, and Embodied AI. I am particularly interested in building
  robust perception systems that enable intelligent agents to
  understand real-world environments.

research_interests:
  - Visual Place Recognition
  - Visual Localization
  - Robust Image Retrieval
  - Multimodal Robot Perception
  - Embodied Navigation

